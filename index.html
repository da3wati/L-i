
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f0e5">
  <title>Lilia & Ilies | Invitation de mariage</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f0e5;
      font-family: Georgia, serif;
    }

    /* واجهة الظرف */
    #envelopeScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f8f0e5;
      cursor: pointer;
      opacity: 1;
      visibility: visible;
      transition: opacity 1s ease, visibility 1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #envelopeScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    .tap-hint {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: max(35px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 13px 23px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50px;
      background: rgba(92, 55, 28, 0.72);
      color: #fff8ed;
      font-size: 12px;
      letter-spacing: 2px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: pulse 2s infinite;
      pointer-events: none;
    }

    /* شاشة الدعوة القابلة للتمرير */
    #invitationScreen {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #f8f0e5;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    #invitationScreen.show {
      opacity: 1;
      visibility: visible;
    }

    .invitation-scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 100%;
    }

    .invitation-image {
      display: block;
      width: 100%;
      height: auto;
      flex-shrink: 0;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* زر الموسيقى */
    #musicButton {
      position: fixed;
      z-index: 20;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      border: 1px solid rgba(183, 145, 83, 0.7);
      border-radius: 50%;
      background: rgba(255, 250, 240, 0.94);
      color: #76512b;
      box-shadow: 0 4px 20px rgba(50, 30, 10, 0.18);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s ease;
    }

    #musicButton.visible {
      display: flex;
    }

    #musicButton:active {
      transform: scale(0.92);
    }

    #musicButton svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- واجهة الظرف -->
  <section
    id="envelopeScreen"
    role="button"
    tabindex="0"
    aria-label="Ouvrir l'invitation"
  >
    <img
      src="envelope.png"
      class="envelope-image"
      alt="Enveloppe de mariage de Lilia et Ilies"
    >

    <div class="tap-hint">TOUCHER POUR OUVRIR</div>
  </section>

  <!-- الدعوة: صورتان عموديتان -->
  <main id="invitationScreen">
    <div class="invitation-scroll">

      <img
        src="invitation1.png"
        class="invitation-image"
        alt="Première partie de l'invitation de mariage"
      >

      <img
        src="invitation2.png"
        class="invitation-image"
        alt="Deuxième partie de l'invitation de mariage"
      >

    </div>
  </main>

  <!-- الموسيقى -->
  <audio
    id="weddingMusic"
    src="music.mp3"
    preload="auto"
    loop
  ></audio>

  <!-- زر تشغيل وإيقاف الموسيقى -->
  <button
    id="musicButton"
    type="button"
    aria-label="Mettre la musique en pause"
    title="Musique"
  >
    <svg id="musicIcon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 18V5l12-2v13"></path>
      <circle cx="6" cy="18" r="3"></circle>
      <circle cx="18" cy="16" r="3"></circle>
    </svg>
  </button>

  <script>
    const envelopeScreen = document.getElementById("envelopeScreen");
    const invitationScreen = document.getElementById("invitationScreen");
    const weddingMusic = document.getElementById("weddingMusic");
    const musicButton = document.getElementById("musicButton");
    const musicIcon = document.getElementById("musicIcon");

    let opened = false;

    const playIcon = `
      <path d="m9 5 11 7-11 7z"></path>
    `;

    const pauseIcon = `
      <path d="M8 5v14"></path>
      <path d="M16 5v14"></path>
    `;

    function updateMusicButton() {
      if (weddingMusic.paused) {
        musicIcon.innerHTML = playIcon;
        musicButton.setAttribute("aria-label", "Lire la musique");
        musicButton.title = "Lire la musique";
      } else {
        musicIcon.innerHTML = pauseIcon;
        musicButton.setAttribute("aria-label", "Mettre la musique en pause");
        musicButton.title = "Mettre la musique en pause";
      }
    }

    async function openInvitation() {
      if (opened) return;
      opened = true;

      invitationScreen.classList.add("show");
      envelopeScreen.classList.add("hide");
      musicButton.classList.add("visible");

      try {
        await weddingMusic.play();
      } catch (error) {
        console.warn("La musique n'a pas pu démarrer :", error);
      }

      updateMusicButton();
    }

    envelopeScreen.addEventListener("click", openInvitation);

    envelopeScreen.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openInvitation();
      }
    });

    musicButton.addEventListener("click", async (event) => {
      event.stopPropagation();

      if (weddingMusic.paused) {
        try {
          await weddingMusic.play();
        } catch (error) {
          console.warn("Impossible de lire la musique :", error);
        }
      } else {
        weddingMusic.pause();
      }

      updateMusicButton();
    });

    weddingMusic.addEventListener("play", updateMusicButton);
    weddingMusic.addEventListener("pause", updateMusicButton);
  </script>

</body>
</html>
